server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Resolve "backend" lazily (per-request) instead of at startup, so this
    # container still boots when there's no "backend" host to find (e.g. when
    # deployed as a standalone service with VITE_API_BASE_URL set, which makes
    # the frontend call the backend directly and never hit this location).
    # When proxy_pass's target contains a variable, nginx does NOT do its usual
    # automatic prefix-replacement (location match -> proxy_pass URI) — it would
    # otherwise forward every request as a literal "/api/", dropping the rest of
    # the path (e.g. "/api/convert" becoming just "/api/"). $request_uri carries
    # the original path (and query string) through untouched.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}